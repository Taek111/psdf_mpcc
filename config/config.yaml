# MPC Test Configuration File
# You can configure various combinations of MPC tests.

# Test configuration list
# Each test can have the following options:
# Environment type (options: "s_path", "straight_corridor", "maze", "oblique_maze", "parking")
# Robot shape (options: "rectangle", "pentagon", "triangle", "lshape")
# Optimizer type (options: "psdf", "mpcc", "rmpcc", "rmpcc_pv", "acados", "casadi", "dcbf", "dcbf_casadi")
# Dynamics model (currently only "differential_drive" is supported)
# Path planner type (options: "astar", "hybrid_astar")

test_configs:
  - maze_type: "maze"
    robot_shape: "rectangle"
    optimizer_type: "rmpcc"
    dynamics_type: "differential_drive"
    path_planner: "astar"

  - maze_type: "s_path"
    robot_shape: "rectangle"
    optimizer_type: "rmpcc"
    dynamics_type: "differential_drive"
    path_planner: "astar"

