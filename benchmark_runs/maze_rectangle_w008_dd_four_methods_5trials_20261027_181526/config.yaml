# Rectangle geometry in source snapshot: length=0.15 m, width=0.08 m.
start_perturbation:
  enabled: true
  seed: 0
  position_std: 0.02
  heading_std_deg: 2.8647889756541165
  max_sigma: 3.0
  min_clearance: 0.01
  max_attempts: 1000
localization_error:
  enabled: false
defaults:
  simulation_time: 60.0
  generate_animation: false
  generate_plots: false
trial_failure_criteria:
  enabled: true
  movement_window_sec: 4.0
  movement_threshold: 0.03
  max_consecutive_solver_failures: 20
cc_mf_imp:
  augmented_psdf_device: cuda
  chance_epsilon: 0.2
  d_min: 0.001
  d_col: 0.001
  d_mf_mask: 0.001
  use_obstacle_constraint: true
  use_row_mf: true
  mf_active_start_step: 1
  mf_active_end_step: null
  mf_active_terminal: true
  mf_imp_root_max_iter: 12
  mf_imp_root_atol_m: 1.0e-08
  mf_imp_root_rtol: 1.0e-10
  mf_imp_root_prob_atol: 1.0e-10
  mf_slack_linear: 100.0
  mf_slack_quadratic: 1.0
  debug_mf: false
test_configs:
- maze_type: maze
  robot_shape: rectangle
  optimizer_type: mpcc
  dynamics_type: differential_drive
  path_planner: astar
- maze_type: maze
  robot_shape: rectangle
  optimizer_type: cc_sf
  dynamics_type: differential_drive
  path_planner: astar
- maze_type: maze
  robot_shape: rectangle
  optimizer_type: cc_ecs
  dynamics_type: differential_drive
  path_planner: astar
- maze_type: maze
  robot_shape: rectangle
  optimizer_type: cc_mf_imp
  dynamics_type: differential_drive
  path_planner: astar
trials: 5
cc_sf:
  debug_mode: false
cc_ecs:
  debug_mode: false
