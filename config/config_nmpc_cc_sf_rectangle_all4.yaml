# CC-SF rectangle runs with a projected-variance PSDF margin.

test_configs:
  - maze_type: "s_path"
    robot_shape: "rectangle"
    optimizer_type: "cc_sf"
    dynamics_type: "differential_drive"
    path_planner: "astar"

  - maze_type: "straight_corridor"
    robot_shape: "rectangle"
    optimizer_type: "cc_sf"
    dynamics_type: "differential_drive"
    path_planner: "astar"

  - maze_type: "maze"
    robot_shape: "rectangle"
    optimizer_type: "cc_sf"
    dynamics_type: "differential_drive"
    path_planner: "astar"

  - maze_type: "oblique_maze"
    robot_shape: "rectangle"
    optimizer_type: "cc_sf"
    dynamics_type: "differential_drive"
    path_planner: "astar"

defaults:
  frame_skip: 2
  simulation_time: 30.0
  generate_animation: true
  generate_plots: false
  speed_range: [0.0, 0.30]
  clearance_range: [-0.08, 0.08]
  risk_range: [0.0, 0.035]

cc_sf:
  debug_risk: true
