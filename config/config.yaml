# Default settings
# Common settings applied to all tests
defaults:
  frame_skip: 2                # Animation frame skip (1=every frame, 5=every 5th frame)
  simulation_time: 20.0         # Simulation time (seconds)
  generate_animation: true      # Whether to generate animation (true/false)
  generate_plots: true          # Whether to generate static plots (true/false)
  plot_covariance: false        # Overlay RMPCC directional covariance axes/arcs on world plots
  speed_range: [0.0, 0.30]      # Shared color scale for speed heatmaps [m/s]
  clearance_range: [0.00, 0.03] # Shared color scale for clearance/SDF heatmaps [m]
  risk_range: [0.0, 0.045]     # Shared color scale for risk heatmaps [m]

# =====================================================
# Option descriptions:
# =====================================================
#
# maze_type options:
#   - "s_path": Simple S-shaped path environment
#   - "straight_corridor": Straight path with a narrow corridor in the middle
#   - "maze": Complex maze environment  
#   - "oblique_maze": Maze with tilted obstacles
#   - "parking": Parking scenario environment
#
# robot_shape options:
#   - "rectangle": Rectangular robot (0.15x0.06m)
#   - "pentagon": Pentagon robot (radius 0.05m)
#   - "triangle": Triangle robot
#   - "lshape": L-shaped robot
#
# optimizer_type options:
#   - "psdf": PSDF-based SQP optimizer (obstacle avoidance)
#   - "mpcc": MPCC optimizer with PSDF safety constraint
#   - "rmpcc": MPCC with fixed signed-PSDF guard and stage-masked MF affine rows
#   - "rmpcc_pv": Risk-aware MPCC optimizer with a projected-variance PSDF margin
#   - "acados": ACADOS SQP-based NMPC
#   - "casadi": CasADi-based basic NMPC  
#   - "dcbf": DCBF-based SQP optimizer
#   - "dcbf_casadi": DCBF-based CasADi optimizer
#
# dynamics_type options:
#   - "differential_drive": Differential drive robot model (currently the only option)
#
# path_planner options:
#   - "astar": Traditional A* with Line of Sight path reduction
#   - "hybrid_astar": Hybrid A* considering vehicle kinematics
# =====================================================
