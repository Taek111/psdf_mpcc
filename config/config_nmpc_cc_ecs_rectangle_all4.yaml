# CC-ECS pose confidence ellipsoid baseline; one run per environment.
# Run explicitly: python test_nmpc.py -c config/config_nmpc_cc_ecs_rectangle_all4.yaml
test_configs:
  - maze_type: s_path
    robot_shape: rectangle
    optimizer_type: cc_ecs
    dynamics_type: differential_drive
    path_planner: astar
  - maze_type: straight_corridor
    robot_shape: rectangle
    optimizer_type: cc_ecs
    dynamics_type: differential_drive
    path_planner: astar
  - maze_type: maze
    robot_shape: rectangle
    optimizer_type: cc_ecs
    dynamics_type: differential_drive
    path_planner: astar
  - maze_type: oblique_maze
    robot_shape: rectangle
    optimizer_type: cc_ecs
    dynamics_type: differential_drive
    path_planner: astar

defaults:
  simulation_time: 60.0
  generate_animation: false
  generate_plots: false

localization_error:
  enabled: false

trial_failure_criteria:
  enabled: true
  movement_window_sec: 4.0
  movement_threshold: 0.03
  max_consecutive_solver_failures: 20

cc_ecs:
  horizon: 20
  tf: 2.0
  chance_epsilon: 0.20  # Total budget over prediction stages 1..N.
  d_min: 0.001
  robust_horizon: null  # min(10, horizon); covariance is frozen afterwards.
  sigma_f0: 0.0002
  sigma_l0: 0.00025
  sigma_psi0: 0.00025
  # Q = 0: retain control-dependent A Sigma A^T covariance propagation.
  q_f0: 0.0
  q_l0: 0.0
  q_psi0: 0.0
  alpha_f: 0.0
  alpha_v: 0.0
  alpha_kappa: 0.0
  beta_v: 0.0
  beta_kappa: 0.0
  beta_omega: 0.0
  enable_backup_solver: false
